<main class="home-editorial" dir="rtl">
  <section class="editorial-hero" aria-labelledby="home-hero-title">
    <h1 id="home-hero-title" class="sr-only">گالری مظهری؛ پوشاک و اکسسوری عروس</h1>

    <div class="editorial-hero__media-shell" aria-hidden="true">
      <img
        class="editorial-hero__media"
        [src]="bridalImage()"
        alt=""
        width="1003"
        height="1568"
        loading="eager"
        fetchpriority="high"
        decoding="async"
      />
    </div>
  </section>

  <nav class="editorial-entry-actions" aria-label="مسیرهای اصلی فروشگاه">
    <a class="editorial-entry-action" routerLink="/catalog">پوشاک عروس</a>
    <a class="editorial-entry-action" routerLink="/accessories">فروشگاه اکسسوری</a>
  </nav>

  <section class="heritage-note" aria-labelledby="heritage-note-title">
    <p class="heritage-note__year" lang="en" dir="ltr">EST. 1958</p>
    <div class="heritage-note__body">
      <p class="editorial-kicker">از سال ۱۳۳۷ با شما هستیم</p>
      <h2 id="heritage-note-title">نسل‌ها کنار لحظه‌های ماندگار شما</h2>
      <p>
        گالری مظهری امروز همان تجربه‌ای را ادامه می‌دهد که از چند نسل قبل آغاز شد؛
        با نگاهی تازه‌تر، شخصی‌تر و نزدیک‌تر به داستان هر عروس.
      </p>
    </div>
    <a class="heritage-note__link" routerLink="/catalog">
      شروع انتخاب شما
      <span aria-hidden="true">←</span>
    </a>
  </section>

  <app-category-showcase></app-category-showcase>

  <!-- Optional discounts render nothing when the API has no active promotion. -->
  <app-discount-showcase></app-discount-showcase>

  <app-subcategory-carousel></app-subcategory-carousel>

  <app-home-appointment></app-home-appointment>

  <app-lookbook-matchmaker></app-lookbook-matchmaker>

  <app-real-brides></app-real-brides>

  <app-interactive-guide-faq></app-interactive-guide-faq>

  <app-trust-guarantees></app-trust-guarantees>
</main>
