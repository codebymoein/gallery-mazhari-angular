<!-- ══════════════════════════════════
     Split Hero
     ══════════════════════════════════ -->
<section class="split-hero" dir="rtl" aria-label="صفحه اصلی گالری مظهری">

  <!-- Panel 1: اکسسوری -->
  <article class="split-hero__panel split-hero__panel--accessories">
    <img class="split-hero__media" [src]="accessoryImage()"
         alt="" width="1000" height="1250"
         loading="lazy" decoding="async" aria-hidden="true"/>
    <div class="split-hero__content">
      <p class="split-hero__eyebrow" lang="en" dir="ltr">THE FINISHING TOUCH</p>
      <h2 class="split-hero__title">دنیای اکسسوری عروس</h2>
      <p class="split-hero__subtitle">
        اکسسوری‌های منتخب را آنلاین، سریع و با اطمینان خرید کنید
      </p>
      <a class="split-hero__button split-hero__button--ghost"
         routerLink="/accessories"
         aria-label="رفتن به دسته‌بندی محصولات">
        فروشگاه اکسسوری
      </a>
    </div>
  </article>

  <!-- Panel 2: لباس عروس -->
  <article class="split-hero__panel split-hero__panel--bridal">
    <img class="split-hero__media" [src]="bridalImage()"
         alt="" width="1003" height="1568"
         loading="eager" fetchpriority="high" decoding="async" aria-hidden="true"/>
    <div class="split-hero__content">
      <p class="split-hero__eyebrow" lang="en" dir="ltr">THE BRIDAL COLLECTION</p>
      <h1 class="split-hero__title">کالکشن<br>لباس عروس</h1>
      <p class="split-hero__subtitle">
        تجربه‌ای اختصاصی برای انتخاب و پرو لباس عروس با مشاوره VIP
      </p>
      <a class="split-hero__button split-hero__button--ghost"
         routerLink="/catalog"
         aria-label="مشاهده کالکشن لباس عروس">
        مشاهده کالکشن و مشاوره
      </a>
    </div>
  </article>

</section>
