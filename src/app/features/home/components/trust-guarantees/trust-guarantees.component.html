<section class="trust-strip" [class.trust-strip--ready]="motionReady" dir="rtl" aria-labelledby="trust-strip-title">
  <header class="trust-strip__header">
    <h2 id="trust-strip-title" class="trust-strip__title">
      <span>به وبسایت گالری مظهری</span>
      <span>کامل ترین فروشگاه آنلاین حوزه عروس</span>
      <span>خوش آمدید</span>
    </h2>
  </header>

  <ul class="trust-strip__list" role="list">
    @for (item of items; track item.id; let index = $index) {
      <li #trustItem class="trust-strip__item" [class.is-visible]="visibleItems.has(index)">
        <span class="trust-strip__art" [class]="'trust-strip__art trust-strip__art--' + item.id" aria-hidden="true">
          <span class="trust-strip__sprite"></span>
        </span>
        <span class="trust-strip__label">{{ item.label }}</span>
      </li>
    }
  </ul>
</section>
