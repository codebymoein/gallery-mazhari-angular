<section class="trust-strip" [class.trust-strip--ready]="motionReady" dir="rtl" aria-labelledby="trust-strip-title">
  <header class="trust-strip__header">
    <p class="trust-strip__kicker" lang="en" dir="ltr">GALLERY MAZHARI · EST. 1337</p>
    <h2 id="trust-strip-title" class="trust-strip__title">
      <span class="trust-strip__title-main">به دنیای گالری مظهری خوش آمدید</span>
      <span class="trust-strip__title-sub">کامل‌ترین انتخاب برای عروس، از لباس تا آخرین جزئیات</span>
    </h2>
    <p class="trust-strip__intro">از سال ۱۳۳۷، همراه انتخاب‌های ماندگار شما</p>
  </header>

  <ul class="trust-strip__list" role="list">
    @for (item of items; track item.id; let index = $index) {
      <li #trustItem class="trust-strip__item" [class.is-visible]="visibleItems.has(index)">
        <span class="trust-strip__art" [class]="'trust-strip__art trust-strip__art--' + item.id" aria-hidden="true">
          <span class="trust-strip__sprite"></span>
        </span>
        <span class="trust-strip__label">{{ item.label }}</span>
        <button
          class="trust-strip__toggle"
          type="button"
          [attr.aria-label]="'توضیحات ' + item.label"
          [attr.aria-expanded]="expandedItemId() === item.id"
          [attr.aria-controls]="'trust-details-' + item.id"
          (click)="toggleDetails(item.id)"
        >
          <span aria-hidden="true"></span>
        </button>
        <div
          class="trust-strip__details"
          [class.trust-strip__details--open]="expandedItemId() === item.id"
          [attr.id]="'trust-details-' + item.id"
          [attr.aria-hidden]="expandedItemId() !== item.id"
        >
          <div><p>{{ item.description }}</p></div>
        </div>
      </li>
    }
  </ul>
</section>
