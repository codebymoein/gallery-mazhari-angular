<main class="reset" dir="rtl"><section class="reset__card" aria-labelledby="reset-title">
  <p class="reset__eyebrow">SECURE PASSWORD RESET</p><h1 id="reset-title">تعیین رمز عبور جدید</h1>
  <p>رمزی حداقل ۱۲ نویسه‌ای و غیرتکراری انتخاب کنید.</p>
  <form (ngSubmit)="submit()">
    <label>رمز جدید<input type="password" name="password" autocomplete="new-password" [(ngModel)]="password" minlength="12" required></label>
    <label>تکرار رمز<input type="password" name="confirmPassword" autocomplete="new-password" [(ngModel)]="confirmPassword" minlength="12" required></label>
    <button type="submit" [disabled]="submitting">{{ submitting ? 'در حال ذخیره…' : 'ذخیره رمز جدید' }}</button>
  </form>
  @if (error) { <p class="reset__error" role="alert">{{ error }}</p> }
  @if (success) { <p class="reset__success" role="status">{{ success }}</p> }
  <a routerLink="/admin/login">بازگشت به ورود ادمین</a>
</section></main>
