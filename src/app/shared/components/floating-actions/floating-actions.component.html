<div class="floating-actions" dir="rtl" aria-label="اقدامات سریع">

  <!-- Wishlist / Compare -->
  <button
    type="button"
    class="floating-actions__wishlist"
    [class.floating-actions__wishlist--active]="hasWishlist"
    [attr.aria-pressed]="hasWishlist"
    [attr.aria-label]="hasWishlist ? 'لیست علاقه‌مندی‌ها (' + wishlistCount + ')' : 'افزودن به علاقه‌مندی‌ها'"
    (click)="toggleWishlist()">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        [attr.fill]="hasWishlist ? 'currentColor' : 'none'"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 20.5 4.3 13A5.2 5.2 0 0 1 12 6a5.2 5.2 0 0 1 7.7 7Z"/>
    </svg>
    <span *ngIf="wishlistCount > 0" class="floating-actions__wishlist-count" aria-hidden="true">
      {{ wishlistCount }}
    </span>
  </button>

  <div class="floating-actions__cluster">

    <!-- Quick Callback -->
    <div class="floating-actions__callback">
      <button
        type="button"
        class="floating-actions__pill"
        [attr.aria-expanded]="callbackOpen"
        aria-controls="floating-callback-popup"
        (click)="toggleCallback()">
        تماس با من
      </button>

      <div
        *ngIf="callbackOpen"
        id="floating-callback-popup"
        class="floating-actions__popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="floating-callback-title">
        <p class="floating-actions__popup-title" id="floating-callback-title">
          درخواست تماس سریع
        </p>

        <ng-container *ngIf="!submitted; else successTpl">
          <label class="floating-actions__label" for="floating-callback-phone">
            شماره موبایل
          </label>
          <input
            id="floating-callback-phone"
            class="floating-actions__input"
            type="tel"
            name="phone"
            inputmode="tel"
            autocomplete="tel"
            maxlength="15"
            placeholder="09xxxxxxxxx"
            [(ngModel)]="phone"
            (keydown.enter)="submitCallback()"/>
          <p *ngIf="submitError" class="floating-actions__error" role="alert">
            {{ submitError }}
          </p>
          <button
            type="button"
            class="floating-actions__submit"
            (click)="submitCallback()">
            ارسال
          </button>
        </ng-container>

        <ng-template #successTpl>
          <p class="floating-actions__success" role="status">
            درخواست شما ثبت شد. به‌زودی تماس می‌گیریم.
          </p>
        </ng-template>

        <button
          type="button"
          class="floating-actions__popup-close"
          aria-label="بستن"
          (click)="closeCallback()">
          ×
        </button>
      </div>
    </div>

    <!-- WhatsApp FAB -->
    <a
      class="floating-actions__fab floating-actions__fab--whatsapp"
      [href]="whatsappHref"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="چت واتساپ با گالری مظهری">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.4A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.1-.3.2-.5.1a6.7 6.7 0 0 1-2-1.2 7.4 7.4 0 0 1-1.4-1.7c-.1-.3 0-.4.1-.5l.4-.5c.1-.1.1-.3.2-.4 0-.1 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3a8.8 8.8 0 0 0 3.4 3.1c2.1 1.1 2.1.7 2.5.7.4 0 1.2-.5 1.4-1 .2-.5.2-.9.1-1 0-.1-.2-.1-.4-.2Z"/>
      </svg>
    </a>

    <!-- Telegram (secondary chat) -->
    <a
      class="floating-actions__fab floating-actions__fab--telegram"
      [href]="telegramHref"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="چت تلگرام با گالری مظهری">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M21.8 4.3 2.9 11.6c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.7.4.9 1 .9.6 0 .9-.3 1.2-.6l2.8-2.7 5.8 4.3c1.1.6 1.8.3 2.1-1l3.5-16.4c.4-1.4-.5-2-1.7-1.6Z"/>
      </svg>
    </a>
  </div>
</div>
