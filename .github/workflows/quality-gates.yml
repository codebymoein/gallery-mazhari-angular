name: Quality Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changed risk surfaces
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.risk.outputs.frontend }}
      backend: ${{ steps.risk.outputs.backend }}
      postgres: ${{ steps.risk.outputs.postgres }}
      e2e: ${{ steps.risk.outputs.e2e }}
      accessibility: ${{ steps.risk.outputs.accessibility }}
      dependency_security: ${{ steps.risk.outputs.dependency_security }}
      static_analysis: ${{ steps.risk.outputs.static_analysis }}
      tier: ${{ steps.risk.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: risk
        name: Derive applicable gates from final diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" ]]; then
            printf '%s\n' '__FULL__' > changed-files.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          fi

          cat changed-files.txt

          frontend=false
          backend=false
          postgres=false
          e2e=false
          accessibility=false
          dependency_security=false
          static_analysis=false
          tier=A

          if grep -qx '__FULL__' changed-files.txt; then
            frontend=true
            backend=true
            postgres=true
            e2e=true
            accessibility=true
            dependency_security=true
            static_analysis=true
            tier=C
          else
            if grep -Eq '^(src/|angular\.json$|tsconfig.*\.json$|package\.json$|package-lock\.json$|\.stylelintrc\.json$)' changed-files.txt; then
              frontend=true
            fi

            if grep -Eq '^backend/' changed-files.txt; then
              backend=true
              tier=C
            fi

            if grep -Eq '^(backend/src/.*(migration|migrations|database|entities|entity)|backend/package\.json$|backend/package-lock\.json$)' changed-files.txt; then
              postgres=true
              tier=C
            fi

            if grep -Eq '^(package\.json$|package-lock\.json$|backend/package\.json$|backend/package-lock\.json$)' changed-files.txt; then
              dependency_security=true
              tier=C
            fi

            if grep -Eq '^(src/.*\.(ts|html)$|e2e/|playwright.*|backend/src/)' changed-files.txt; then
              e2e=true
              if [[ "$tier" == A ]]; then tier=B; fi
            fi

            if grep -Eq '^(src/.*\.(html|css|scss)$|src/styles/|e2e/accessibility\.spec\.ts$|docs/handbook/17-seo-performance-accessibility\.md$)' changed-files.txt; then
              accessibility=true
            fi

            if grep -Eq '^(src/.*\.ts$|backend/src/.*\.ts$|\.dependency-cruiser\.cjs$|knip.*|\.github/workflows/quality-gates\.yml$)' changed-files.txt; then
              static_analysis=true
            fi

            if grep -Eq '^(\.github/workflows/|deploy/|backend/src/auth/|backend/src/payments/|backend/src/orders/|backend/src/products/|backend/src/platform/)' changed-files.txt; then
              backend=true
              postgres=true
              e2e=true
              dependency_security=true
              static_analysis=true
              tier=C
            fi
          fi

          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "postgres=$postgres"
            echo "e2e=$e2e"
            echo "accessibility=$accessibility"
            echo "dependency_security=$dependency_security"
            echo "static_analysis=$static_analysis"
            echo "tier=$tier"
          } >> "$GITHUB_OUTPUT"

          echo "Selected verification tier: $tier"

  governance-contract:
    name: Governance contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate remediation/agent PR contract
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get('PR_BODY', '')
          failures = []

          required_fields = [
              'Remediation / task ID',
              'Base SHA',
              'In scope',
              'Explicitly out of scope',
              'Governance documents actually read',
              'Rollback / roll-forward plan',
          ]

          for label in required_fields:
              match = re.search(rf'^- {re.escape(label)}:\s*(.+)$', body, re.MULTILINE)
              if not match or not match.group(1).strip():
                  failures.append(f'missing/non-empty field: {label}')

          required_acknowledgements = [
              'Repository identity was verified as `codebymoein/gallery-mazhari-angular` from GitHub.',
              'Current `main` SHA was independently fetched before work began.',
              '`AGENTS.md`, `CONSTITUTION.md`, `docs/PROJECT_MEMORY.md`, handbook index, mandatory chapters, and task-relevant chapters were read.',
              'No unrelated findings, adjacent RM work, opportunistic cleanup, or refactors are included.',
              'Quality gates were not weakened/bypassed merely to obtain a passing run.',
              'Merge authorization comes from the human owner; the agent is not self-authorizing approval.',
          ]

          for text in required_acknowledgements:
              checked = f'- [x] {text}' in body or f'- [X] {text}' in body
              if not checked:
                  failures.append(f'unchecked governance acknowledgement: {text}')

          remediation = re.search(r'^- Remediation / task ID:\s*(.+)$', body, re.MULTILINE)
          task_id = remediation.group(1).strip() if remediation else ''
          is_remediation = bool(re.search(r'\bRM-\d+\b|\bPR-\d+\b|finding', task_id, re.IGNORECASE))
          if is_remediation:
              roadmap_ack = '- [x] For remediation work, `docs/remediation/MASTER_REMEDIATION_ROADMAP.md` was read and the exact Wave/RM/PR/finding scope was identified.' in body or '- [X] For remediation work, `docs/remediation/MASTER_REMEDIATION_ROADMAP.md` was read and the exact Wave/RM/PR/finding scope was identified.' in body
              if not roadmap_ack:
                  failures.append('remediation PR must explicitly acknowledge the Master Remediation Roadmap')

              for label in ('Roadmap Wave / PR slice (or `N/A` for non-remediation)', 'Linked finding IDs (or `N/A`)'):
                  match = re.search(rf'^- {re.escape(label)}:\s*(.+)$', body, re.MULTILINE)
                  if not match or not match.group(1).strip() or match.group(1).strip().upper() == 'N/A':
                      failures.append(f'remediation PR requires field: {label}')

          if failures:
              print('Governance contract failed:')
              for failure in failures:
                  print(f' - {failure}')
              sys.exit(1)

          print('Governance contract passed.')
          PY

  frontend:
    name: Frontend lint, test, build
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Frontend lint regression gate
        run: |
          set -euo pipefail
          set +e
          npm run lint 2>&1 | tee frontend-lint.txt
          lint_exit=${PIPESTATUS[0]}
          set -e
          summary=$(grep -E '✖ [0-9]+ problems \([0-9]+ errors, [0-9]+ warnings\)' frontend-lint.txt | tail -1 || true)
          if [ -z "$summary" ]; then
            if [ "$lint_exit" -eq 0 ]; then
              echo "Frontend lint passed with zero reported errors."
              exit 0
            fi
            echo "Unable to parse frontend lint result."
            exit 1
          fi
          errors=$(printf '%s' "$summary" | sed -E 's/.*\(([0-9]+) errors, ([0-9]+) warnings\).*/\1/')
          warnings=$(printf '%s' "$summary" | sed -E 's/.*\(([0-9]+) errors, ([0-9]+) warnings\).*/\2/')
          echo "Frontend lint baseline: errors=${errors}, warnings=${warnings}; allowed <=8 errors and <=90 warnings."
          test "$errors" -le 8
          test "$warnings" -le 90
      - run: npm test
      - name: Frontend coverage evidence
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary
      - run: npm run build:prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-quality-evidence
          path: |
            frontend-lint.txt
            coverage
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Backend lint, test, build
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - name: Backend lint regression gate
        run: |
          set -euo pipefail
          set +e
          npm --prefix backend run lint 2>&1 | tee backend-lint.txt
          lint_exit=${PIPESTATUS[0]}
          set -e
          summary=$(grep -E '✖ [0-9]+ problems \([0-9]+ errors, [0-9]+ warnings\)' backend-lint.txt | tail -1 || true)
          if [ -z "$summary" ]; then
            if [ "$lint_exit" -eq 0 ]; then
              echo "Backend lint passed with zero reported errors."
              exit 0
            fi
            echo "Unable to parse backend lint result."
            exit 1
          fi
          errors=$(printf '%s' "$summary" | sed -E 's/.*\(([0-9]+) errors, ([0-9]+) warnings\).*/\1/')
          warnings=$(printf '%s' "$summary" | sed -E 's/.*\(([0-9]+) errors, ([0-9]+) warnings\).*/\2/')
          echo "Backend lint baseline: errors=${errors}, warnings=${warnings}; allowed <=283 errors and <=6 warnings."
          test "$errors" -le 283
          test "$warnings" -le 6
      - run: npm --prefix backend test -- --runInBand
      - name: Backend coverage threshold gate
        run: npm --prefix backend run test:cov -- --runInBand --coverageReporters=text --coverageReporters=json-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-evidence
          path: |
            backend-lint.txt
            backend/coverage
          if-no-files-found: warn
          retention-days: 14
      - run: npm --prefix backend run build

  postgres-migrations:
    name: PostgreSQL migration chain and schema drift
    needs: classify
    if: needs.classify.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gallery_ci
          POSTGRES_PASSWORD: gallery_ci_password
          POSTGRES_DB: gallery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gallery_ci -d gallery_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: gallery_ci
      DB_PASSWORD: gallery_ci_password
      DB_NAME: gallery_ci
      JWT_SECRET: ci_only_jwt_secret_not_for_production
      ADMIN_SETUP_KEY: ci_only_admin_setup_key
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - name: Apply migrations to empty PostgreSQL database
        run: npm --prefix backend run migration:run
      - name: Verify migration status
        run: npm --prefix backend run migration:show | tee migration-status.txt
      - name: Report existing entity/migrated-schema drift
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix backend run schema:log 2>&1 | tee schema-drift.txt
          if grep -qiE 'schema is up to date|no changes in database schema' schema-drift.txt; then
            echo "Entity and migrated schema are in parity."
          else
            echo "::warning::Existing entity/migration schema drift detected. This is recorded as remediation debt and does not weaken the blocking fresh-migration gate."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-migration-evidence
          path: |
            migration-status.txt
            schema-drift.txt
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Playwright critical journeys
    needs: classify
    if: needs.classify.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
      DB_TYPE: sqlite
      DB_SQLITE_PATH: /tmp/gallery-mazhari-e2e.sqlite
      FRONTEND_ORIGIN: http://127.0.0.1:4200
      BACKEND_PUBLIC_URL: http://127.0.0.1:3000
      JWT_SECRET: ci_only_jwt_secret_not_for_production
      ADMIN_SETUP_KEY: ci_only_admin_setup_key
      NODE_ENV: test
      E2E_BASE_URL: http://127.0.0.1:4200
      E2E_API_URL: http://127.0.0.1:3000
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npx playwright install --with-deps chromium
      - name: Run business-critical E2E suite
        run: npx playwright test e2e/backend.spec.ts e2e/cart-and-checkout.spec.ts e2e/routing-and-seo.spec.ts e2e/storefront.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-critical-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

  accessibility-report:
    name: Accessibility debt report
    needs: classify
    if: needs.classify.outputs.accessibility == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI: true
      DB_TYPE: sqlite
      DB_SQLITE_PATH: /tmp/gallery-mazhari-a11y.sqlite
      FRONTEND_ORIGIN: http://127.0.0.1:4200
      BACKEND_PUBLIC_URL: http://127.0.0.1:3000
      JWT_SECRET: ci_only_jwt_secret_not_for_production
      ADMIN_SETUP_KEY: ci_only_admin_setup_key
      NODE_ENV: test
      E2E_BASE_URL: http://127.0.0.1:4200
      E2E_API_URL: http://127.0.0.1:3000
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npx playwright install --with-deps chromium
      - name: Run accessibility suite without masking existing RM-14 debt
        run: npx playwright test e2e/accessibility.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    name: Dependency security audit
    needs: classify
    if: needs.classify.outputs.dependency_security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --package-lock-only --omit=dev --audit-level=high
      - run: npm --prefix backend audit --package-lock-only --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis-report:
    name: Static debt reports
    needs: classify
    if: needs.classify.outputs.static_analysis == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: mkdir -p reports
      - name: CSS governance report
        continue-on-error: true
        run: npx --yes stylelint@16.23.1 "src/**/*.css" --config .stylelintrc.json > reports/stylelint.txt 2>&1
      - name: Architecture dependency report
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes dependency-cruiser@17.3.1 \
            --validate .dependency-cruiser.cjs \
            --output-type json \
            "src/**/*.ts" "backend/src/**/*.ts" \
            > reports/dependency-cruiser.json \
            2> reports/dependency-cruiser.stderr.txt
          cruise_exit=$?
          set -e
          CRUISE_EXIT="$cruise_exit" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('reports/dependency-cruiser.json')
          if not path.exists() or not path.read_text().strip():
              raise SystemExit('dependency-cruiser produced no JSON evidence')
          report = json.loads(path.read_text())
          modules = report.get('modules', [])
          if not modules:
              raise SystemExit('dependency-cruiser evidence is invalid: zero modules analyzed')
          summary = report.get('summary', {})
          print(
              'dependency-cruiser evidence: '
              f'modules={len(modules)}, '
              f'dependencies={summary.get("totalDependenciesCruised", "unknown")}, '
              f'ruleErrors={summary.get("error", "unknown")}, '
              f'cliExit={os.environ.get("CRUISE_EXIT", "unknown")}'
          )
          PY
      - name: Dead-code report
        shell: bash
        run: |
          set -euo pipefail
          npx --yes knip@6.29.0 \
            --reporter json \
            --no-progress \
            --no-exit-code \
            > reports/knip.json \
            2> reports/knip.stderr.txt
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('reports/knip.json')
          if not path.exists() or not path.read_text().strip():
              raise SystemExit('knip produced no JSON evidence')
          report = json.loads(path.read_text())
          issues = report.get('issues')
          if not isinstance(issues, list):
              raise SystemExit('knip evidence is invalid: missing issues array')
          print(f'knip produced structured evidence for {len(issues)} files with findings')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: reports
          if-no-files-found: error
          retention-days: 14

  required-quality-gates:
    name: Required quality gates
    if: always()
    needs:
      - classify
      - governance-contract
      - frontend
      - backend
      - postgres-migrations
      - e2e
      - dependency-security
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Enforce applicable blocking gate results
        env:
          CLASSIFY: ${{ needs.classify.result }}
          GOVERNANCE: ${{ needs.governance-contract.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          POSTGRES: ${{ needs.postgres-migrations.result }}
          E2E: ${{ needs.e2e.result }}
          DEPENDENCY_SECURITY: ${{ needs.dependency-security.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          printf 'classify=%s\ngovernance=%s\nfrontend=%s\nbackend=%s\npostgres=%s\ne2e=%s\ndependency-security=%s\nsecret-scan=%s\n' \
            "$CLASSIFY" "$GOVERNANCE" "$FRONTEND" "$BACKEND" "$POSTGRES" "$E2E" "$DEPENDENCY_SECURITY" "$SECRET_SCAN"
          test "$CLASSIFY" = success
          test "$GOVERNANCE" = success
          test "$SECRET_SCAN" = success
          for result in "$FRONTEND" "$BACKEND" "$POSTGRES" "$E2E" "$DEPENDENCY_SECURITY"; do
            [[ "$result" == success || "$result" == skipped ]]
          done
