name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfile-repair-evidence:
    name: Lockfile repair evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/rm-02-ci-quality-gates'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfiles without installing runtime artifacts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix backend install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfiles when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json backend/package-lock.json; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          git commit -m "fix(rm-02): synchronize npm lockfiles"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:prod

  backend:
    name: Backend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend run lint
      - run: npm --prefix backend test -- --runInBand
      - name: Backend coverage report
        run: npm --prefix backend run test:cov -- --runInBand --coverageReporters=text --coverageReporters=json-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn
          retention-days: 14
      - run: npm --prefix backend run build

  postgres-migrations:
    name: PostgreSQL migration chain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gallery_ci
          POSTGRES_PASSWORD: gallery_ci_password
          POSTGRES_DB: gallery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gallery_ci -d gallery_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: gallery_ci
      DB_PASSWORD: gallery_ci_password
      DB_NAME: gallery_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - name: Apply migrations to empty PostgreSQL database
        run: npm --prefix backend run migration:run
      - name: Verify migration status
        run: npm --prefix backend run migration:show | tee migration-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-migration-status
          path: migration-status.txt
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Playwright critical journeys
    runs-on: ubuntu-latest
    env:
      CI: true
      DB_TYPE: sqlite
      DB_SQLITE_PATH: /tmp/gallery-mazhari-e2e.sqlite
      FRONTEND_ORIGIN: http://127.0.0.1:4200
      BACKEND_PUBLIC_URL: http://127.0.0.1:3000
      JWT_SECRET: ci_only_jwt_secret_not_for_production
      ADMIN_SETUP_KEY: ci_only_admin_setup_key
      NODE_ENV: test
      E2E_BASE_URL: http://127.0.0.1:4200
      E2E_API_URL: http://127.0.0.1:3000
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --package-lock-only --omit=dev --audit-level=high
      - run: npm --prefix backend audit --package-lock-only --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis-report:
    name: Static debt reports
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: mkdir -p reports
      - name: CSS governance report
        continue-on-error: true
        run: npx --yes stylelint@16.23.1 "src/**/*.css" --config .stylelintrc.json > reports/stylelint.txt 2>&1
      - name: Architecture dependency report
        continue-on-error: true
        run: npx --yes dependency-cruiser@17.3.1 --validate .dependency-cruiser.cjs src backend/src > reports/dependency-cruiser.txt 2>&1
      - name: Dead-code report
        continue-on-error: true
        run: npx --yes knip@5.62.0 > reports/knip.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: reports
          if-no-files-found: error
          retention-days: 14

  required-quality-gates:
    name: Required quality gates
    if: always()
    needs:
      - frontend
      - backend
      - postgres-migrations
      - e2e
      - dependency-security
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Enforce blocking gate results
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          POSTGRES: ${{ needs.postgres-migrations.result }}
          E2E: ${{ needs.e2e.result }}
          DEPENDENCY_SECURITY: ${{ needs.dependency-security.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          printf 'frontend=%s\nbackend=%s\npostgres=%s\ne2e=%s\ndependency-security=%s\nsecret-scan=%s\n' \
            "$FRONTEND" "$BACKEND" "$POSTGRES" "$E2E" "$DEPENDENCY_SECURITY" "$SECRET_SCAN"
          test "$FRONTEND" = success
          test "$BACKEND" = success
          test "$POSTGRES" = success
          test "$E2E" = success
          test "$DEPENDENCY_SECURITY" = success
          test "$SECRET_SCAN" = success
