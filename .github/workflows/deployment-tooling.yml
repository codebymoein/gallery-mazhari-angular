name: Deployment Tooling

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/release-artifact.yml'
      - '.github/workflows/deployment-tooling.yml'
      - 'docs/PLATFORM_DEPLOYMENT.md'
      - 'docs/handbook/14-deployment-operations.md'
      - 'docs/handbook/15-observability.md'
      - 'docs/handbook/16-backup-disaster-recovery.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deployment-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n \
            deploy/release.sh \
            deploy/backup-postgres.sh \
            deploy/backup-media.sh \
            deploy/restore-postgres.sh \
            deploy/rollback-release.sh \
            deploy/health-check.sh
      - name: ShellCheck deployment scripts
        run: |
          shellcheck \
            deploy/release.sh \
            deploy/backup-postgres.sh \
            deploy/backup-media.sh \
            deploy/restore-postgres.sh \
            deploy/rollback-release.sh \
            deploy/health-check.sh
      - name: Prove production restore is fail-closed
        run: |
          set +e
          NODE_ENV=production \
            RESTORE_TARGET_ENV=recovery \
            RESTORE_CONFIRM_NON_PRODUCTION=I_UNDERSTAND_THIS_IS_NON_PRODUCTION \
            bash deploy/restore-postgres.sh missing.dump.age missing.dump.age.sha256
          status=$?
          set -e
          test "$status" -eq 77
      - name: Validate systemd unit syntax
        run: |
          set -euo pipefail
          unit_dir="$(mktemp -d)"
          cp deploy/gallery-mazhari-backend.service.example "${unit_dir}/gallery-mazhari-backend.service"
          cp deploy/gallery-mazhari-backup.service.example "${unit_dir}/gallery-mazhari-backup.service"
          cp deploy/gallery-mazhari-backup.timer.example "${unit_dir}/gallery-mazhari-backup.timer"
          sed -i 's|^ExecStart=.*|ExecStart=/bin/true|' "${unit_dir}/gallery-mazhari-backend.service"
          sed -i 's|^ExecStart=.*|ExecStart=/bin/true|' "${unit_dir}/gallery-mazhari-backup.service"
          systemd-analyze verify "${unit_dir}/gallery-mazhari-backend.service"
          systemd-analyze verify "${unit_dir}/gallery-mazhari-backup.service" "${unit_dir}/gallery-mazhari-backup.timer"
