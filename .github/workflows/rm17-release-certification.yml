name: RM-17 Release Certification Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'angular.json'
      - '.github/workflows/rm17-release-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DB_TYPE: sqlite
  DB_SQLITE_PATH: /tmp/gallery-mazhari-rm17.sqlite
  FRONTEND_ORIGIN: http://127.0.0.1:4000
  BACKEND_PUBLIC_URL: http://127.0.0.1:3000
  JWT_SECRET: ci_only_jwt_secret_not_for_production
  ADMIN_SETUP_KEY: ci_only_admin_setup_key
  NODE_ENV: test
  APP_REVISION: ${{ github.sha }}
  BUILD_ID: ${{ github.run_id }}

jobs:
  release-candidate:
    name: Exact-SHA provenance and production-like smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
      - name: Build exact release candidate
        run: |
          npm run build:prod
          npm --prefix backend run build
      - name: Validate certification tooling
        run: |
          bash -n deploy/certify-release-candidate.sh deploy/certification-smoke.sh
          shellcheck deploy/certify-release-candidate.sh deploy/certification-smoke.sh
      - name: Assemble candidate provenance surface
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/release-${RELEASE_SHA}"
          mkdir -p "${release_dir}/frontend/browser" "${release_dir}/frontend/server" "${release_dir}/backend/dist" "${release_dir}/deploy"
          cp -a dist/gallery-mazhari-angular/browser/. "${release_dir}/frontend/browser/"
          cp -a dist/gallery-mazhari-angular/server/. "${release_dir}/frontend/server/"
          cp -a backend/dist/. "${release_dir}/backend/dist/"
          cp deploy/release.sh deploy/rollback-release.sh deploy/health-check.sh "${release_dir}/deploy/"
          printf '%s\n' "${RELEASE_SHA}" > "${release_dir}/REVISION"
          printf '{"revision":"%s","workflow_run":"%s"}\n' "${RELEASE_SHA}" "${GITHUB_RUN_ID}" > "${release_dir}/BUILD.json"
          bash deploy/certify-release-candidate.sh "${release_dir}" "${RELEASE_SHA}"
          mkdir -p reports/release
          cp "${release_dir}/REVISION" "${release_dir}/BUILD.json" "${release_dir}/CERTIFIED_REVISION" "${release_dir}/CERTIFICATION_FILE_HASHES.sha256" reports/release/
      - name: Start candidate backend
        run: |
          set -euo pipefail
          node backend/dist/main.js > /tmp/rm17-backend.log 2>&1 &
          echo $! > /tmp/rm17-backend.pid
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/ops/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rm17-backend.log
          exit 1
      - name: Start candidate SSR storefront
        env:
          PORT: '4000'
        run: |
          set -euo pipefail
          node dist/gallery-mazhari-angular/server/server.mjs > /tmp/rm17-ssr.log 2>&1 &
          echo $! > /tmp/rm17-ssr.pid
          for attempt in {1..45}; do
            if curl --fail --silent -H 'Host: gallery-mazhari.ir' http://127.0.0.1:4000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rm17-ssr.log
          exit 1
      - name: Run production-like crawler and health smoke
        env:
          STOREFRONT_URL: http://127.0.0.1:4000
          STOREFRONT_HOST: gallery-mazhari.ir
          BACKEND_URL: http://127.0.0.1:3000
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash deploy/certification-smoke.sh
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm17-release-certification-${{ github.sha }}
          path: |
            reports/release
            /tmp/rm17-backend.log
            /tmp/rm17-ssr.log
          if-no-files-found: warn
          retention-days: 30
      - name: Stop candidate processes
        if: always()
        run: |
          if [[ -f /tmp/rm17-ssr.pid ]]; then kill "$(cat /tmp/rm17-ssr.pid)" || true; fi
          if [[ -f /tmp/rm17-backend.pid ]]; then kill "$(cat /tmp/rm17-backend.pid)" || true; fi
