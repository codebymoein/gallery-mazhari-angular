name: PR-005 formatter
on:
  push:
    branches: [security/pr-005-session-foundation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npx --prefix backend prettier --write backend/src/auth backend/src/database/entities.ts backend/src/database/migrations/1786000000000-CreateAuthSessions.ts backend/src/database/migrations/index.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/auth backend/src/database/entities.ts backend/src/database/migrations/1786000000000-CreateAuthSessions.ts backend/src/database/migrations/index.ts
          git diff --cached --quiet || git commit -m "style(pr-005): format session security changes"
          git push
