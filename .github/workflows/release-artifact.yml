name: Release Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci

      - name: Build frontend SSR and backend
        run: |
          npm run build:prod
          npm --prefix backend run build

      - name: Retain production dependencies only
        run: |
          npm prune --omit=dev
          npm --prefix backend prune --omit=dev

      - name: Assemble immutable release payload
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_dir="release-${RELEASE_SHA}"
          mkdir -p "${release_dir}/frontend/browser" "${release_dir}/frontend/server" "${release_dir}/backend" "${release_dir}/deploy"
          cp -a dist/gallery-mazhari-angular/browser/. "${release_dir}/frontend/browser/"
          cp -a dist/gallery-mazhari-angular/server/. "${release_dir}/frontend/server/"
          cp -a node_modules "${release_dir}/frontend/node_modules"
          cp package.json package-lock.json "${release_dir}/frontend/"
          cp -a backend/dist "${release_dir}/backend/dist"
          cp -a backend/node_modules "${release_dir}/backend/node_modules"
          cp backend/package.json backend/package-lock.json "${release_dir}/backend/"
          cp -a deploy/. "${release_dir}/deploy/"
          find "${release_dir}/deploy" -maxdepth 1 -type f -name '*.sh' -exec chmod +x {} +
          printf '%s\n' "${RELEASE_SHA}" > "${release_dir}/REVISION"
          printf '{"revision":"%s","workflow_run":"%s"}\n' "${RELEASE_SHA}" "${GITHUB_RUN_ID}" > "${release_dir}/BUILD.json"
          tar -czf "gallery-mazhari-${RELEASE_SHA}.tar.gz" "${release_dir}"
          sha256sum "gallery-mazhari-${RELEASE_SHA}.tar.gz" > "gallery-mazhari-${RELEASE_SHA}.tar.gz.sha256"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-mazhari-release-${{ github.sha }}
          path: |
            gallery-mazhari-${{ github.sha }}.tar.gz
            gallery-mazhari-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable V2 release assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="auto-v2-${RELEASE_SHA}"
          artifact="gallery-mazhari-${RELEASE_SHA}.tar.gz"
          checksum="${artifact}.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$artifact" "$checksum" --clobber
          else
            gh release create "$tag" "$artifact" "$checksum" \
              --target "$RELEASE_SHA" \
              --title "V2 ${RELEASE_SHA}" \
              --notes "Immutable V2 deployment candidate for main@${RELEASE_SHA}." \
              --prerelease
          fi
