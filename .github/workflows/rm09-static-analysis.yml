name: RM-09 Static Analysis Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'backend/src/**/*.ts'
      - '.dependency-cruiser.cjs'
      - 'knip.json'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/rm09-static-analysis.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rm09-static-analysis:
    name: RM-09 dependency and dead-code evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: mkdir -p reports/rm09

      - name: Dependency graph evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes dependency-cruiser@17.3.1 --info > reports/rm09/dependency-cruiser-info.txt 2>&1
          set +e
          npx --yes dependency-cruiser@17.3.1 \
            --validate .dependency-cruiser.cjs \
            --output-type json \
            "src/**/*.ts" "backend/src/**/*.ts" \
            > reports/rm09/dependency-cruiser.json \
            2> reports/rm09/dependency-cruiser.stderr.txt
          cruise_exit=$?
          set -e
          CRUISE_EXIT="$cruise_exit" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('reports/rm09/dependency-cruiser.json')
          if not path.exists() or not path.read_text().strip():
              raise SystemExit('dependency-cruiser produced no JSON evidence')
          report = json.loads(path.read_text())
          modules = report.get('modules', [])
          if not modules:
              raise SystemExit('dependency-cruiser evidence is invalid: zero modules analyzed')
          summary = report.get('summary', {})
          print(
              'dependency-cruiser evidence: '
              f'modules={len(modules)}, '
              f'dependencies={summary.get("totalDependenciesCruised", "unknown")}, '
              f'ruleErrors={summary.get("error", "unknown")}, '
              f'cliExit={os.environ.get("CRUISE_EXIT", "unknown")}'
          )
          PY

      - name: Knip dead-code evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes knip@6.29.0 \
            --reporter json \
            --no-progress \
            --no-exit-code \
            > reports/rm09/knip.json \
            2> reports/rm09/knip.stderr.txt
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('reports/rm09/knip.json')
          if not path.exists() or not path.read_text().strip():
              raise SystemExit('knip evidence is invalid: empty report')
          report = json.loads(path.read_text())
          issues = report.get('issues')
          if not isinstance(issues, list):
              raise SystemExit('knip evidence is invalid: missing issues array')
          print(f'knip produced structured evidence for {len(issues)} files with findings')
          PY

      - name: Duplication evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes jscpd@4.0.5 src backend/src \
            --reporters json \
            --output reports/rm09/jscpd \
            --ignore "**/node_modules/**,**/dist/**,**/coverage/**" \
            > reports/rm09/jscpd.txt 2>&1
          jscpd_exit=$?
          set -e
          test -s reports/rm09/jscpd/jscpd-report.json
          JSCPD_EXIT="$jscpd_exit" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('reports/rm09/jscpd/jscpd-report.json')
          report = json.loads(path.read_text())
          statistics = report.get('statistics', {})
          total = statistics.get('total', {}) if isinstance(statistics, dict) else {}
          print(
              'jscpd evidence: '
              f'clones={total.get("clones", "unknown")}, '
              f'duplicatedLines={total.get("duplicatedLines", "unknown")}, '
              f'cliExit={os.environ.get("JSCPD_EXIT", "unknown")}'
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm09-static-analysis-evidence
          path: reports/rm09
          if-no-files-found: error
          retention-days: 14
