name: RM-09 Static Analysis Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rm09-static-analysis:
    name: RM-09 dependency and dead-code evidence
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: mkdir -p reports/rm09

      - name: Dependency graph evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes -p typescript@5.9.3 -p dependency-cruiser@17.3.1 depcruise \
            --validate .dependency-cruiser.cjs \
            --output-type json \
            -- src backend/src > reports/rm09/dependency-cruiser.json 2> reports/rm09/dependency-cruiser.stderr.txt
          cruise_exit=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('reports/rm09/dependency-cruiser.json')
          if not path.exists() or not path.read_text().strip():
              raise SystemExit('dependency-cruiser produced no JSON evidence')
          report = json.loads(path.read_text())
          modules = report.get('modules', [])
          if not modules:
              raise SystemExit('dependency-cruiser evidence is invalid: zero modules analyzed')
          print(f'dependency-cruiser analyzed {len(modules)} modules')
          PY
          exit "$cruise_exit"

      - name: Knip dead-code evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes knip@6.29.0 --reporter json --no-progress > reports/rm09/knip.json 2> reports/rm09/knip.stderr.txt
          knip_exit=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('reports/rm09/knip.json')
          if not path.exists() or not path.read_text().strip():
              raise SystemExit('knip produced no JSON evidence')
          report = json.loads(path.read_text())
          issues = report.get('issues')
          if not isinstance(issues, list):
              raise SystemExit('knip evidence is invalid: missing issues array')
          print(f'knip produced structured evidence for {len(issues)} files with findings')
          PY
          exit "$knip_exit"

      - name: Duplication evidence
        shell: bash
        continue-on-error: true
        run: |
          npx --yes jscpd@4.0.5 src backend/src \
            --reporters json \
            --output reports/rm09/jscpd \
            --ignore "**/node_modules/**,**/dist/**,**/coverage/**" \
            > reports/rm09/jscpd.txt 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm09-static-analysis-evidence
          path: reports/rm09
          if-no-files-found: error
          retention-days: 14
