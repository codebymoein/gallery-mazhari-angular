name: RM-09 Static Analysis Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'backend/src/**/*.ts'
      - '.dependency-cruiser.cjs'
      - 'knip.json'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/rm09-static-analysis.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rm09-static-analysis:
    name: RM-09 dependency and dead-code evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: mkdir -p reports/rm09
      - name: Dependency graph evidence
        run: npx --yes dependency-cruiser@17.3.1 --validate .dependency-cruiser.cjs --output-type json "src/**/*.ts" "backend/src/**/*.ts" > reports/rm09/dependency-cruiser.json
      - name: Knip dead-code evidence
        run: npx --yes knip@6.29.0 --reporter json --no-progress --no-exit-code > reports/rm09/knip.json
      - name: Duplication evidence
        continue-on-error: true
        run: npx --yes jscpd@4.0.5 src backend/src --reporters json --output reports/rm09/jscpd --ignore "**/node_modules/**,**/dist/**,**/coverage/**"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm09-static-analysis-evidence
          path: reports/rm09
          if-no-files-found: error
          retention-days: 14
